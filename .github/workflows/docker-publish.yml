name: docker-publish

# Multi-platform build and publish of the image to Docker Hub.
# Required repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (access token: hub.docker.com -> Account Settings -> Security).

on:
  push:
    branches: [main]
    tags: ['v*']
  # Build PRs without pushing — verify the Dockerfile still builds
  pull_request:
    branches: [main]
  # Scheduled monthly rebuild (UTC): picks up fresh base-image layers
  # and OS patches (apt-get upgrade in the final Dockerfile stage)
  schedule:
    - cron: '37 5 2 * *'
  workflow_dispatch:

# contents: write — the release step creates a git tag and a GitHub Release
permissions:
  contents: write

env:
  IMAGE_NAME: vkosin/npm-ntlm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Versions come from the Dockerfile ARGs — the single source of truth
      # (the same ARGs that version-check.yml bumps in its PRs)
      - name: Extract versions from Dockerfile
        id: ver
        run: |
          NPM_VER=$(grep -oP 'ARG NPM_IMAGE=jc21/nginx-proxy-manager:\K\S+' Dockerfile)
          OR_VER=$(grep -oP '^ARG OPENRESTY_VERSION=\K\S+' Dockerfile)
          echo "npm=$NPM_VER" >> "$GITHUB_OUTPUT"
          echo "openresty=$OR_VER" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # PRs only verify the build, nothing is pushed to the registry
          push: ${{ github.event_name != 'pull_request' }}
          # The version tag is mutable: the monthly scheduled rebuild
          # refreshes it together with latest (OS patches)
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.npm }}
          # layer cache between CI runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Auto-release: when a push to main raises the NPM_IMAGE ARG (a merged
      # version-check PR or a manual bump), create tag v<NPM version> and a
      # Release. A tag created by GITHUB_TOKEN does not trigger workflows, so
      # the tags: ['v*'] trigger will not cause a duplicate build.
      - name: Create GitHub Release for new NPM version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.npm }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi
          gh release create "$TAG" \
            --title "NPM ${{ steps.ver.outputs.npm }} / OpenResty ${{ steps.ver.outputs.openresty }}" \
            --notes "NPM ${{ steps.ver.outputs.npm }} (OpenResty ${{ steps.ver.outputs.openresty }}) + NTLM module.

          NPM changelog: https://github.com/NginxProxyManager/nginx-proxy-manager/releases/tag/v${{ steps.ver.outputs.npm }}

          Docker: \`docker pull vkosin/npm-ntlm:${{ steps.ver.outputs.npm }}\`"
