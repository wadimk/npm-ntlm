# =========================================================================
# Вставьте это в Proxy Host -> Advanced -> Custom Nginx Configuration
# в веб-интерфейсе NGINX Proxy Manager (порт 81).
#
# Перед вставкой замените:
#   owa.example.com                 -> ваш публичный FQDN для OWA
#   exchange.internal.example.com   -> внутренний FQDN сервера Exchange 2019
# =========================================================================

keepalive_timeout 3h;
tcp_nodelay on;
client_max_body_size 3g;

# buffering and timeouts
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 3h;
proxy_send_timeout 3h;
proxy_connect_timeout 20s;

# required for NTLM and stable upstream connections
proxy_http_version 1.1;
proxy_set_header Connection "";

# standard headers
proxy_set_header Accept-Encoding "identity";

# pass request headers upstream, and allow key response headers back
proxy_pass_request_headers on;
proxy_pass_header WWW-Authenticate;
proxy_pass_header Authorization;

proxy_ssl_server_name on;

# ---------- Health probe ----------
location = / {
    return 200 "ok";
    add_header Content-Type text/plain;
}

# ---------- NTLM-backed services ----------

# Autodiscover
location ~* ^/(autodiscover|Autodiscover|AutoDiscover)/ {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization $http_authorization;

  proxy_ssl_name exchange.internal.example.com;
  proxy_pass https://exch_ntlm;

  access_log /var/log/nginx/ntlm_access.log ntlm_log;
  error_log  /var/log/nginx/ntlm_error.log warn;
}

# EWS
location /ews/ {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization $http_authorization;

  proxy_ssl_name exchange.internal.example.com;
  proxy_pass https://exch_ntlm;

  access_log /var/log/nginx/ntlm_access.log ntlm_log;
  error_log  /var/log/nginx/ntlm_error.log warn;
}

# EWS MRS Proxy
location = /ews/mrsproxy.svc {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization $http_authorization;

  proxy_ssl_name exchange.internal.example.com;
  proxy_pass https://exch_ntlm;

  access_log /var/log/nginx/ntlm_access.log ntlm_log;
  error_log  /var/log/nginx/ntlm_error.log warn;
}

# MAPI over HTTP
location /mapi/ {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Proxy-Support "Session-Based-Authentication";
  proxy_set_header Authorization $http_authorization;

  proxy_ssl_name exchange.internal.example.com;
  proxy_pass https://exch_ntlm;

  access_log /var/log/nginx/ntlm_access.log ntlm_log;
  error_log  /var/log/nginx/ntlm_error.log warn;
}

# Outlook Anywhere RPC
location /rpc {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization $http_authorization;

  proxy_ssl_name exchange.internal.example.com;
  proxy_pass https://exch_ntlm;

  access_log /var/log/nginx/ntlm_access.log ntlm_log;
  error_log  /var/log/nginx/ntlm_error.log warn;
}

# ActiveSync
location /Microsoft-Server-ActiveSync {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization $http_authorization;

  proxy_ssl_name exchange.internal.example.com;
  proxy_pass https://exch_ntlm;

  access_log /var/log/nginx/ntlm_access.log ntlm_log;
  error_log  /var/log/nginx/ntlm_error.log warn;
}

# OAB
location /oab {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Authorization $http_authorization;

  proxy_ssl_name exchange.internal.example.com;
  proxy_pass https://exch_ntlm;

  access_log /var/log/nginx/ntlm_access.log ntlm_log;
  error_log  /var/log/nginx/ntlm_error.log warn;
}

# ---------- OWA и ECP (pass-through, без NTLM) ----------
# Host должен совпадать с URL виртуальных каталогов Exchange.
# Authorization обрезается — NTLM в OWA/ECP не проходит.

location /owa/ {
  proxy_set_header Host owa.example.com;
  proxy_set_header Authorization "";
  proxy_ssl_name exchange.internal.example.com;
  proxy_redirect off; # preserve Location headers from Exchange
  proxy_pass https://exchange.internal.example.com;
}

location /ecp/ {
  proxy_set_header Host owa.example.com;
  proxy_set_header Authorization "";
  proxy_ssl_name exchange.internal.example.com;
  proxy_redirect off; # preserve Location headers from Exchange
  proxy_pass https://exchange.internal.example.com;
}
