# TLS-политика NPM (заменяет файл образа nginx-full), intermediate-набор Mozilla
# плюс два CBC-сьюта из списка шифров Microsoft 365
# (https://learn.microsoft.com/en-us/purview/technical-reference-details-about-encryption):
#   TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384 = ECDHE-RSA-AES256-SHA384
#   TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256 = ECDHE-RSA-AES128-SHA256
# Они нужны старым клиентам Schannel (Windows 7/8.1, Outlook 2013/2016),
# где нет AES-GCM. Стоят в конце списка — GCM-сьюты остаются приоритетными.
# NB: RSA-сьюты работают только с RSA-сертификатом; при выпуске LE-сертификата
# в UI выбирайте Key Type: RSA (дефолтный ECDSA с RSA-сьютами несовместим).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256';
ssl_prefer_server_ciphers off;
